version: 0.3.0
targets:
  stm32l496g-disco:
    chip: stm32l496ag
    ariel:
      swi: UART5
    leds:
      led0:
        pin: PB13
        aliases:
          - LD2
        color: green
      led1:
        pin: PA5
        aliases:
          - LD3
        color: green
    buttons:
      button0:
        pin: PC13
        aliases:
          - JOY_CEL
      button1:
        pin: PI8
        aliases:
          - JOY_UP
      button2:
        pin: PI10
        aliases:
          - JOY_DOWN
      button3:
        pin: PI9
        aliases:
          - JOY_LEFT
      button4:
        pin: PF11
        aliases:
          - JOY_RIGHT
    usb:
      usb_vbus:
        pin: PA9
      usb_id:
        pin: PA10
      usb_dm:
        pin: PA11
      usb_dp:
        pin: PA12
      